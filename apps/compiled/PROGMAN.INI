; Native WINN Program Manager groups (not the Win3.x binary .GRP format).
; Commands are resolved relative to WINN.EXE's directory.
[Settings]
MinOnRun=0

[Group1]
Name=Main
Item1=File Manager,WINFILE.EXE
Item2=Control Panel,CONTROL.EXE
Item3=Print Manager,PRINTMAN.EXE
Item4=Clipboard Viewer,CLIPBRD.EXE
Item5=PIF Editor,PIFEDIT.EXE
Item6=Windows Setup,SETUP.EXE
Item7=Read Me,README.WRI

[Group2]
Name=Accessories
Item1=Write,WRITE.EXE
Item2=Paintbrush,PBRUSH.EXE
Item3=Terminal,TERMINAL.EXE
Item4=Notepad,NOTEPAD.EXE
Item5=Recorder,RECORDER.EXE
Item6=Cardfile,CARDFILE.EXE
Item7=Calculator,CALC.EXE
Item8=Clock,CLOCK.EXE
Item9=Character Map,CHARMAP.EXE
Item10=Media Player,MPLAYER.EXE
Item11=Sound Recorder,SOUNDREC.EXE
Item12=Object Packager,PACKAGER.EXE

[Group3]
Name=Games
Item1=Solitaire,SOL.EXE
Item2=Minesweeper,WINMINE.EXE
Item3=Hearts,MSHEARTS.EXE

[Group4]
Name=Startup
; Native PROGMAN does not auto-execute Startup group items yet.
