; SYSTEM.INI for WINN.EXE - put it next to WINN.EXE.
; Without this file (or without a key) the built-in drivers are used:
; VGA 640x480 in 16 colours (mode 12h; VBE 100h 640x400x256 if it cannot
; start) and the DOS keyboard/mouse driver.

[boot]
; The shell: started first; Windows ends when it ends. Without the key it is
; PROGMAN.EXE (if present); "shell=" with nothing leaves only the program
; given on the command line (WINN DEMO).
shell=PROGMAN.EXE
; Display driver module from the same directory, e.g. 800x600 in 16 colours:
;display.drv=VGA800.DRV
;input.drv=
; The start-up logo (WINLOGO.BMP, WINLOG16.BMP) stays at least this many
; milliseconds, while the shell loads; 0: no logo. "WINN :" also starts
; without it.
;logo.time=2000

[display]
; Mode hints for the display driver (0 or missing = driver default); the
; built-in VBE 640x400 in 256 colours instead of VGA 640x480x16:
;width=640
;height=400

[debug]
; 1: WINN keeps the last calls Win16 programs made, and Ctrl+Esc (the
; Task List) writes them to WINNTRACE.LOG here, for a program that hangs:
;trace=1
