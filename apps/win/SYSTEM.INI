; SYSTEM.INI for WINN.EXE - put it next to WINN.EXE.
; Without this file (or without a key) the built-in drivers are used:
; VBE 100h 640x400x256 and the DOS keyboard/mouse driver.

[boot]
; The shell: started first; Windows ends when it ends.
; Without it, WINN runs the program given on its command line (WINN DEMO).
;shell=DEMO.EXE
; Display driver module from the same directory, e.g. 800x600 in 16 colours:
;display.drv=VGA800.DRV
;input.drv=

[display]
; Mode hints for the display driver (0 or missing = driver default)
;width=640
;height=400
