; WIN.INI for WINN.EXE - put it next to WINN.EXE (the Windows directory).
; Programs read and write it (GetProfileString, WriteProfileString); the
; Control Panel keeps its settings here. Without this file (or without a
; key) each setting has its default.

[windows]
; Double-click time in milliseconds; 1: the left and right mouse buttons
; swapped (the Control Panel's Mouse writes both)
DoubleClickSpeed=500
SwapMouseButtons=0

[Desktop]
; The desktop's pattern: 8 rows of bits, or (None); the Control Panel's
; Desktop has the list (CONTROL.INI [Patterns])
Pattern=(None)

[Extensions]
; Documents and the programs that open them (the File Manager, the
; Program Manager's items, ShellExecute, FindExecutable): the extension,
; then the program, ^ and the extension again.
txt=notepad.exe ^.txt
ini=notepad.exe ^.ini
log=notepad.exe ^.log
hlp=winhelp.exe ^.hlp
; Windows 3.11 applications present in the supplied installation.
wri=write.exe ^.wri
bmp=pbrush.exe ^.bmp
pcx=pbrush.exe ^.pcx
crd=cardfile.exe ^.crd
rec=recorder.exe ^.rec
trm=terminal.exe ^.trm
mid=mplayer.exe ^.mid
wav=mplayer.exe ^.wav

[MCI Extensions]
mid=sequencer
rmi=sequencer
wav=waveaudio

[colors]
; The system colours, "red green blue" (0-255 each); the Control Panel's
; Color writes them. Missing ones keep Windows 3.1's standard scheme:
;Background=0 128 128
;AppWorkspace=255 255 255
;Window=255 255 255
;WindowText=0 0 0
;Menu=255 255 255
;MenuText=0 0 0
;ActiveTitle=0 0 128
;InactiveTitle=255 255 255
;TitleText=255 255 255
;InactiveTitleText=0 0 0
;ActiveBorder=192 192 192
;InactiveBorder=192 192 192
;WindowFrame=0 0 0
;Scrollbar=192 192 192
;ButtonFace=192 192 192
;ButtonShadow=128 128 128
;ButtonText=0 0 0
;ButtonHilight=255 255 255
;GrayText=128 128 128
;Hilight=0 0 128
;HilightText=255 255 255

[fonts]
; Raster font files (.FON) for programs' fonts, as Windows 3.1 names them;
; looked for in the Windows directory, then its SYSTEM:
MS Sans Serif 8,10,12,14,18,24 (VGA res)=SSERIFE.FON
MS Serif 8,10,12,14,18,24 (VGA res)=SERIFE.FON
Courier 10,12,15 (VGA res)=COURE.FON
Small Fonts (VGA res)=SMALLE.FON
Symbol 8,10,12,14,18,24 (VGA res)=SYMBOLE.FON
; Windows 3.1's vector fonts (Roman, Script, Modern: ROMAN.FON, SCRIPT.FON,
; MODERN.FON) WINN does not draw.
; TrueType fonts: the .FOT files, each naming its .TTF (looked for where it
; says, beside the .FOT, then in the Windows directory and its SYSTEM). A
; family's regular, bold, italic and bold italic files are its faces;
; "Arial" without Cyrillic letters gives way to "Arial Cyr" (the text is
; Windows-1251).
Arial (TrueType)=ARIAL.FOT
Arial Bold (TrueType)=ARIALBD.FOT
Arial Bold Italic (TrueType)=ARIALBI.FOT
Arial Italic (TrueType)=ARIALI.FOT
Arial Cyr (TrueType)=ARICYR.FOT
Arial Cyr Bold (TrueType)=ARICYRB.FOT
Arial Cyr Bold Italic (TrueType)=ARICYRBI.FOT
Arial Cyr Italic (TrueType)=ARICYRI.FOT
Courier New (TrueType)=COUR.FOT
Courier New Bold (TrueType)=COURBD.FOT
Courier New Bold Italic (TrueType)=COURBI.FOT
Courier New Italic (TrueType)=COURI.FOT
Courier New Cyr (TrueType)=COUCYR.FOT
Courier New Cyr Bold (TrueType)=COUCYRB.FOT
Courier New Cyr Bold Italic (TrueType)=COUCYRBI.FOT
Courier New Cyr Italic (TrueType)=COUCYRI.FOT
Times New Roman (TrueType)=TIMES.FOT
Times New Roman Bold (TrueType)=TIMESBD.FOT
Times New Roman Bold Italic (TrueType)=TIMESBI.FOT
Times New Roman Italic (TrueType)=TIMESI.FOT
Times New Roman Cyr (TrueType)=TIMCYR.FOT
Times New Roman Cyr Bold (TrueType)=TIMCYRB.FOT
Times New Roman Cyr Bold Italic (TrueType)=TIMCYRBI.FOT
Times New Roman Cyr Italic (TrueType)=TIMCYRI.FOT
Symbol (TrueType)=SYMBOL.FOT
WingDings (TrueType)=WINGDING.FOT
; Central European ones (Windows-1250, without Cyrillic):
;Arial CE (TrueType)=CEARIAL.FOT
;Arial CE Bold (TrueType)=CEARIABD.FOT
;Arial CE Bold Italic (TrueType)=CEARIABI.FOT
;Arial CE Italic (TrueType)=CEARIALI.FOT
;Courier New CE (TrueType)=CECOUR.FOT
;Courier New CE Bold (TrueType)=CECOURBD.FOT
;Courier New CE Bold Italic (TrueType)=CECOURBI.FOT
;Courier New CE Italic (TrueType)=CECOURI.FOT
;Times New Roman CE (TrueType)=CETIMES.FOT
;Times New Roman CE Bold (TrueType)=CETIMEBD.FOT
;Times New Roman CE Bold Italic (TrueType)=CETIMEBI.FOT
;Times New Roman CE Italic (TrueType)=CETIMESI.FOT

[TrueType]
; 0: no TrueType fonts at all
TTEnable=1
; 1: TrueType fonts only (the raster files of [fonts] left out)
TTOnly=0
